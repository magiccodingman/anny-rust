[workspace]
members = ["crates/anny-core", "crates/anny-cli", "crates/anny-capi", "crates/anny-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/magiccodingman/anny-rust"

[workspace.dependencies]
anny-core = { path = "crates/anny-core" }
nalgebra = { version = "=0.33.2", features = ["serde-serialize"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
thiserror = "=2.0.12"
safetensors = "=0.4.5"
flate2 = "=1.1.0"
png = "=0.17.16"
sha2 = "=0.10.8"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"

zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
serde_yaml = "=0.9.34"
base64 = "=0.22.1"

[profile.release]
lto = "thin"
