# Temporary development snapshot; removed after extension validation.
name: Extension bootstrap
on:
  push:
    branches: [codex/anny-rust-native-port]
    paths: [.github/workflows/extension-bootstrap.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Package exact tracked source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          git archive --format=tar HEAD > "$RUNNER_TEMP/bundle/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/bundle/source-commit.txt"
          cargo vendor --locked --versioned-dirs "$RUNNER_TEMP/bundle/vendor" > "$RUNNER_TEMP/bundle/config.toml"
          cd "$RUNNER_TEMP/bundle"
          npm pack gltf-validator@2.0.0-dev.3.10
          tar -czf "$RUNNER_TEMP/extension-inputs.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: extension-inputs
          path: ${{ runner.temp }}/extension-inputs.tar.gz
          retention-days: 1
          compression-level: 0
