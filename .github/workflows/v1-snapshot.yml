# Temporary development input snapshot; removed before handoff.
name: V1 source snapshot
on:
  push:
    branches: [codex/native-v1-completion]
    paths: [.github/workflows/v1-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot tracked source
        run: |
          mkdir -p /tmp/v1-source
          git archive HEAD | gzip > /tmp/v1-source/source.tar.gz
          git rev-parse HEAD > /tmp/v1-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v1-source
          path: /tmp/v1-source
          retention-days: 1
          compression-level: 0
