# Temporary read-only development snapshot; remove before handoff.
# Recovery checkpoint: resume post_gd integration from the published Adam tests.
name: V1 source snapshot
on:
  push:
    branches: [codex/native-v1-completion]
    paths: [.github/workflows/v1-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Snapshot published source and locked dependencies
        run: |
          set -eu
          mkdir -p /tmp/v1-source
          git archive HEAD | gzip > /tmp/v1-source/source.tar.gz
          git rev-parse HEAD > /tmp/v1-source/commit.txt
          cargo vendor --locked /tmp/v1-source/vendor > /tmp/v1-source/vendor-config.toml
          tar -czf /tmp/v1-source/vendor.tar.gz -C /tmp/v1-source vendor
          rm -rf /tmp/v1-source/vendor
      - uses: actions/upload-artifact@v4
        with:
          name: v1-source
          path: /tmp/v1-source
          retention-days: 7
          compression-level: 0
