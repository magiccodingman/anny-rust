name: Temporary final-review repair
on:
  push:
    branches: [codex/native-v1-completion]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-v1-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Apply independently reviewed corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # ---- FFI/WASM session soundness -------------------------------------------------
          # PoseSession stores a borrowed model reference widened to 'static while an Arc owns the
          # allocation. Rust drops struct fields in declaration order, so the borrowed session MUST
          # be declared before the Arc owner. The previous order invalidated the stated unsafe
          # invariant during destruction.
          replace(
              "crates/anny-capi/src/lib.rs",
              '''pub struct AnnySession {\n    /// Keeps the allocation the session evaluates against alive: the session's own reference points\n    /// into it, so it must be dropped with (in practice, after) the session.\n    _model: Arc<Anny>,\n    session: PoseSession<'static>,\n}''',
              '''pub struct AnnySession {\n    // SAFETY INVARIANT: Rust drops fields in declaration order. `session` contains the widened\n    // reference, so it must be destroyed before `_model` releases the Arc allocation it borrows.\n    session: PoseSession<'static>,\n    /// Keeps the allocation the session evaluates against alive until after `session` is dropped.\n    _model: Arc<Anny>,\n}''')
          replace(
              "crates/anny-capi/src/single.rs",
              '''pub struct AnnySessionF32 {\n    /// Keeps the allocation the session evaluates against alive; see `AnnySession`.\n    _model: Arc<AnnyF32>,\n    session: PoseSessionF32<'static>,\n}''',
              '''pub struct AnnySessionF32 {\n    // SAFETY INVARIANT: the borrowed session must drop before the Arc owner; fields drop in\n    // declaration order. See the f64 `AnnySession` for the ownership argument.\n    session: PoseSessionF32<'static>,\n    /// Keeps the allocation alive until after `session` is dropped.\n    _model: Arc<AnnyF32>,\n}''')
          replace(
              "crates/anny-wasm/src/lib.rs",
              '''pub struct AnnySession {\n    _model: Arc<Anny>,\n    session: PoseSession<'static>,\n}''',
              '''pub struct AnnySession {\n    // SAFETY INVARIANT: fields drop in declaration order. The widened borrowed session must be\n    // destroyed before the Arc owner releases the model allocation.\n    session: PoseSession<'static>,\n    _model: Arc<Anny>,\n}''')
          replace(
              "crates/anny-wasm/src/single.rs",
              '''pub struct AnnySessionF32 {\n    _model: Arc<AnnyF32>,\n    session: PoseSessionF32<'static>,\n}''',
              '''pub struct AnnySessionF32 {\n    // SAFETY INVARIANT: fields drop in declaration order. Keep the borrowed session before the\n    // Arc owner so destruction cannot release the model allocation first.\n    session: PoseSessionF32<'static>,\n    _model: Arc<AnnyF32>,\n}''')

          # ---- Browser/native GPU public-input hardening ----------------------------------
          replace(
              "crates/anny-gpu/src/lib.rs",
              '''    #[error("readback failed on the web backend")]\n    WebReadback,\n}''',
              '''    #[error("readback failed on the web backend")]\n    WebReadback,\n    #[error("invalid GPU input: {0}")]\n    InvalidInput(String),\n}''')

          replace(
              "crates/anny-gpu/src/blendshapes.rs",
              '''pub struct Weights {\n    template_buf: wgpu::Buffer,\n    blendshapes_buf: wgpu::Buffer,\n    size: usize,\n    c: usize,\n}''',
              '''pub struct Weights {\n    template_buf: wgpu::Buffer,\n    blendshapes_buf: wgpu::Buffer,\n    size: usize,\n    c: usize,\n    blendshape_len: usize,\n}''')
          replace(
              "crates/anny-gpu/src/blendshapes.rs",
              '''            blendshapes_buf: mk("blendshapes (resident)", as_bytes(blendshapes)),\n            size: template.len(),\n            c,\n        }''',
              '''            blendshapes_buf: mk("blendshapes (resident)", as_bytes(blendshapes)),\n            size: template.len(),\n            c,\n            blendshape_len: blendshapes.len(),\n        }''')
          replace(
              "crates/anny-gpu/src/blendshapes.rs",
              '''    ) -> Result<Vec<f32>, GpuError> {\n        let out_len = batch * self.size;\n        let coeffs_buf = gpu.device.create_buffer(&wgpu::BufferDescriptor {''',
              '''    ) -> Result<Vec<f32>, GpuError> {\n        if batch == 0 || self.c == 0 || self.size == 0 {\n            return Err(GpuError::InvalidInput("batch, coefficient count and output size must be nonzero".into()));\n        }\n        let expected_coefficients = batch\n            .checked_mul(self.c)\n            .ok_or_else(|| GpuError::InvalidInput("coefficient shape overflow".into()))?;\n        if coefficients.len() != expected_coefficients {\n            return Err(GpuError::InvalidInput(format!(\n                "expected {expected_coefficients} coefficients for batch {batch} x {}, got {}",\n                self.c,\n                coefficients.len()\n            )));\n        }\n        let expected_blendshapes = self\n            .c\n            .checked_mul(self.size)\n            .ok_or_else(|| GpuError::InvalidInput("blendshape shape overflow".into()))?;\n        if self.blendshape_len != expected_blendshapes {\n            return Err(GpuError::InvalidInput(format!(\n                "resident blendshape buffer has {} values; expected {expected_blendshapes}",\n                self.blendshape_len\n            )));\n        }\n        let out_len = batch\n            .checked_mul(self.size)\n            .ok_or_else(|| GpuError::InvalidInput("output shape overflow".into()))?;\n        let coeffs_buf = gpu.device.create_buffer(&wgpu::BufferDescriptor {''',
              count=1)
          replace(
              "crates/anny-gpu/src/blendshapes.rs",
              '''    ) -> Result<Vec<f32>, GpuError> {\n        let size = template.len();\n        let out_len = batch * size;\n        let storage = wgpu::BufferUsages::STORAGE | wgpu::BufferUsages::COPY_DST;''',
              '''    ) -> Result<Vec<f32>, GpuError> {\n        let size = template.len();\n        if batch == 0 || c == 0 || size == 0 {\n            return Err(GpuError::InvalidInput("batch, coefficient count and template size must be nonzero".into()));\n        }\n        let expected_blendshapes = c\n            .checked_mul(size)\n            .ok_or_else(|| GpuError::InvalidInput("blendshape shape overflow".into()))?;\n        if blendshapes.len() != expected_blendshapes {\n            return Err(GpuError::InvalidInput(format!(\n                "expected {expected_blendshapes} blendshape values for {c} x {size}, got {}",\n                blendshapes.len()\n            )));\n        }\n        let expected_coefficients = batch\n            .checked_mul(c)\n            .ok_or_else(|| GpuError::InvalidInput("coefficient shape overflow".into()))?;\n        if coefficients.len() != expected_coefficients {\n            return Err(GpuError::InvalidInput(format!(\n                "expected {expected_coefficients} coefficients for batch {batch} x {c}, got {}",\n                coefficients.len()\n            )));\n        }\n        let out_len = batch\n            .checked_mul(size)\n            .ok_or_else(|| GpuError::InvalidInput("output shape overflow".into()))?;\n        let storage = wgpu::BufferUsages::STORAGE | wgpu::BufferUsages::COPY_DST;''',
              count=1)

          replace(
              "crates/anny-wasm/src/gpu.rs",
              '''fn parts(bytes: &[u8]) -> Result<(TensorF32, TensorF32, usize, usize), JsValue> {\n    let model = Anny::from_bytes(bytes, None).map_err(js_error)?;\n    let template = reference(&model, "template_vertices")?;\n    let blendshapes = reference(&model, "blendshapes")?;\n    let c = model.data.blendshape_count();\n    let size = template.data.len();\n    Ok((template, blendshapes, c, size))\n}\n''',
              '''fn parts(bytes: &[u8]) -> Result<(TensorF32, TensorF32, usize, usize), JsValue> {\n    let model = Anny::from_bytes(bytes, None).map_err(js_error)?;\n    let template = reference(&model, "template_vertices")?;\n    let blendshapes = reference(&model, "blendshapes")?;\n    let c = model.data.blendshape_count();\n    let size = template.data.len();\n    Ok((template, blendshapes, c, size))\n}\n\nfn validate_coefficients(coefficients: &[f32], batch: usize, c: usize) -> Result<(), JsValue> {\n    if batch == 0 || c == 0 {\n        return Err(js_error("batch and coefficient count must be nonzero"));\n    }\n    let expected = batch\n        .checked_mul(c)\n        .ok_or_else(|| js_error("coefficient shape overflow"))?;\n    if coefficients.len() != expected {\n        return Err(js_error(format!(\n            "expected {expected} coefficients for batch {batch} x {c}, got {}",\n            coefficients.len()\n        )));\n    }\n    Ok(())\n}\n''')
          replace(
              "crates/anny-wasm/src/gpu.rs",
              '''    let (template, blendshapes, c, size) = parts(bytes)?;\n    let mut out = Vec::with_capacity(batch * size);''',
              '''    let (template, blendshapes, c, size) = parts(bytes)?;\n    validate_coefficients(&coefficients, batch, c)?;\n    let mut out = Vec::with_capacity(batch * size);''')
          replace(
              "crates/anny-wasm/src/gpu.rs",
              '''    let (template, blendshapes, c, _) = parts(bytes)?;\n    let gpu = Gpu::open_async(None).await.map_err(js_error)?;''',
              '''    let (template, blendshapes, c, _) = parts(bytes)?;\n    validate_coefficients(&coefficients, batch, c)?;\n    let gpu = Gpu::open_async(None).await.map_err(js_error)?;''')

          # ---- Unity runtime correctness ---------------------------------------------------
          replace(
              "integrations/unity/package/Runtime/AnnyCharacter.cs",
              '''        [Tooltip("Runtime precision. The f64 model is the authority; f32 is the shipped default.")]\n        public bool singlePrecision = true;''',
              '''        [Tooltip("Compatibility loading switch. Unity's live mesh runtime is always f32; when disabled the payload is opened wide and converted once before use.")]\n        public bool singlePrecision = true;''')
          replace(
              "integrations/unity/package/Runtime/AnnyCharacter.cs",
              '''            if (Runtime != null)\n            {\n                Runtime.Dispose();\n                Runtime = null;\n            }\n\n            if (GeneratedMesh != null)''',
              '''            if (Runtime != null)\n            {\n                Runtime.Dispose();\n                Runtime = null;\n            }\n\n            if (Rig != null && Rig.Root != null)\n            {\n                GameObject rigObject = Rig.Root.gameObject;\n                if (Application.isPlaying)\n                {\n                    Destroy(rigObject);\n                }\n                else\n                {\n                    DestroyImmediate(rigObject);\n                }\n            }\n            Rig = null;\n\n            if (GeneratedMesh != null)''')
          replace(
              "integrations/unity/package/Runtime/AnnyCharacter.cs",
              '''            lastOutput = output;\n            PushOutput(output);''',
              '''            lastOutput = output;\n\n            // A pose session is pinned to the phenotype/local/face coefficients it was created\n            // with. Any full parameter update therefore invalidates the previous session; rebuild\n            // it only after the new evaluation succeeds so a failed Apply leaves the old state intact.\n            if (Session != null)\n            {\n                Session.Dispose();\n                Session = null;\n            }\n            if (usePoseSession)\n            {\n                Session = Runtime.CreateSession(parameters);\n            }\n\n            PushOutput(output);''')
          replace(
              "integrations/unity/package/Runtime/AnnyCharacter.cs",
              '''                Skinned.sharedMesh = GeneratedMesh;\n                Skinned.bones = Rig.Bones;\n                Skinned.rootBone = Rig.Bones.Length > 0 ? Rig.Bones[0] : transform;\n                Skinned.sharedMaterial = ResolveMaterial();\n                Skinned.updateWhenOffscreen = true;\n                return;''',
              '''                Skinned.sharedMesh = GeneratedMesh;\n                Skinned.bones = Rig.Bones;\n                Skinned.rootBone = Rig.Bones.Length > 0 ? Rig.Bones[0] : transform;\n                Skinned.sharedMaterial = ResolveMaterial();\n                Skinned.updateWhenOffscreen = true;\n                Skinned.enabled = true;\n                if (MeshRenderer != null)\n                {\n                    MeshRenderer.enabled = false;\n                }\n                return;''')
          replace(
              "integrations/unity/package/Runtime/AnnyCharacter.cs",
              '''            if (MeshRenderer == null)\n            {\n                MeshRenderer = gameObject.AddComponent<MeshRenderer>();\n            }\n\n            MeshRenderer.sharedMaterial = ResolveMaterial();''',
              '''            if (MeshRenderer == null)\n            {\n                MeshRenderer = gameObject.AddComponent<MeshRenderer>();\n            }\n\n            MeshRenderer.sharedMaterial = ResolveMaterial();\n            MeshRenderer.enabled = true;\n            if (Skinned != null)\n            {\n                Skinned.enabled = false;\n            }''')

          replace(
              "integrations/unity/package/Runtime/AnnyModelF32.cs",
              '''            AnnyNative.Check(AnnyNative.ModelF32PreparedBytes(handle, out IntPtr bytes));\n            return AnnyModel.CopyBytes(new AnnyBytesHandle(bytes));''',
              '''            AnnyNative.Check(AnnyNative.ModelF32PreparedBytes(handle, out IntPtr bytes));\n            using (AnnyBytesHandle owned = new AnnyBytesHandle(bytes))\n            {\n                return AnnyModel.CopyBytes(owned);\n            }''')

          replace(
              "integrations/unity/package/Runtime/AnnyOutput.cs",
              '''        /// <summary>Rest-pose vertex positions, shape <c>[B, vertices, 3]</c>.</summary>\n        public const string Vertices = "vertices";\n\n        /// <summary>Posed vertex positions, shape <c>[B, vertices, 3]</c>.</summary>\n        public const string RestVertices = "rest_vertices";''',
              '''        /// <summary>Posed vertex positions, shape <c>[B, vertices, 3]</c>.</summary>\n        public const string Vertices = "vertices";\n\n        /// <summary>Rest-pose vertex positions, shape <c>[B, vertices, 3]</c>.</summary>\n        public const string RestVertices = "rest_vertices";''')
          replace(
              "integrations/unity/package/Runtime/AnnyOutput.cs",
              '''        public double[] VertexData(int batch = 0)\n        {\n            return Tensor(Vertices).Data;\n        }''',
              '''        public double[] VertexData(int batch = 0)\n        {\n            AnnyTensor vertices = Tensor(Vertices);\n            if (vertices.Rank != 3 || vertices.Shape[2] != 3)\n            {\n                throw new InvalidOperationException("vertices must have shape [batch, vertices, 3]");\n            }\n            if (batch < 0 || batch >= vertices.Shape[0])\n            {\n                throw new ArgumentOutOfRangeException(nameof(batch));\n            }\n            int stride = checked(vertices.Shape[1] * vertices.Shape[2]);\n            double[] result = new double[stride];\n            Array.Copy(vertices.Data, batch * stride, result, 0, stride);\n            return result;\n        }''')

          # Regression: shape changes must rebuild the pose session, and regeneration must not leak rigs.
          marker = '''        [UnityTest]\n        public IEnumerator DisposingTheCharacterReleasesTheNativeModel()'''
          tests = '''        [Test]\n        public void PhenotypeChangeRebuildsSessionBeforeTheNextPose()\n        {\n            AnnyCharacter run = Spawn(AnnyUpdateMode.Exact);\n            run.SetPhenotype("gender", 0.75f);\n            run.Apply();\n\n            float[] shaped = (float[])run.LastVertices().Clone();\n            Assert.IsNotNull(run.Session, "full shape updates must leave a session for the new shape");\n\n            string bone = run.Rig.Labels[0];\n            string poseJson = AnnyRepresentation.NamedPosesToJson(\n                new System.Collections.Generic.Dictionary<string, Matrix4x4>\n                {\n                    { bone, Matrix4x4.Rotate(Quaternion.Euler(12f, 0f, 0f)) }\n                });\n            run.ApplyPose(poseJson);\n            run.ApplyRestPose();\n\n            CollectionAssert.AreEqual(\n                shaped,\n                run.LastVertices(),\n                "returning to rest after a pose must preserve the phenotype used by the latest full Apply");\n        }\n\n        [UnityTest]\n        public IEnumerator RegenerationReplacesTheOldRigHierarchy()\n        {\n            AnnyCharacter run = Spawn(AnnyUpdateMode.Exact);\n            Transform previous = run.Rig.Root;\n            run.Generate();\n            Transform current = run.Rig.Root;\n            Assert.AreNotSame(previous, current, "regeneration must build a fresh rig");\n\n            // Destroy is deferred in PlayMode. After one frame only the current rig may remain.\n            yield return null;\n            Assert.IsTrue(previous == null, "the previous rig root must be destroyed");\n            int liveRigs = 0;\n            for (int i = 0; i < run.transform.childCount; i++)\n            {\n                if (run.transform.GetChild(i).name == "anny_rig")\n                {\n                    liveRigs++;\n                }\n            }\n            Assert.AreEqual(1, liveRigs, "regeneration must not accumulate bone hierarchies");\n        }\n\n''' + marker
          replace("integrations/unity/package/Tests/PlayMode/AnnyCharacterPlayTests.cs", marker, tests)

          # ---- Public documentation --------------------------------------------------------
          replace(
              "README.md",
              '''| `anny-wasm` | Browser/WASM wrapper with owned typed-array results and shared query/authoring operations |''',
              '''| `anny-wasm` | Browser/WASM wrapper with owned typed-array results and shared query/authoring operations |\n| `anny-gpu` | wgpu/WebGPU blendshape compute kernel, native/browser parity gates and resident-weight batching |''')
          replace(
              "README.md",
              '''This managed layer is **not yet the deferred full Unity Runtime/Editor package**.''',
              '''A full Unity 6000 Runtime/Editor package now lives under `integrations/unity/`: native plugin packaging, managed ownership, Mesh/SkinnedMeshRenderer integration, humanoid mapping, editor controls, baking, and real Mono/IL2CPP player qualification. The shipped plugin is Linux x86_64; other platforms build the same C ABI for their target.''')
          replace(
              "README.md",
              '''The core loads prepared model bytes in-memory and returns owned JS typed arrays. `AnnyModel.poseSession()` (and `AnnyModelF32.poseSession()`) returns a reusable `AnnySession` whose `update()` re-poses without re-evaluating the rest of the model; like the other wrappers it returns owned copies and keeps the model alive itself. The current browser example reports geometry and session output rather than rendering.''',
              '''The core loads prepared model bytes in-memory and returns owned JS typed arrays. `AnnyModel.poseSession()` (and `AnnyModelF32.poseSession()`) returns a reusable `AnnySession` whose `update()` re-poses without re-evaluating the rest of the model; like the other wrappers it returns owned copies and keeps the model alive itself. `examples/editor/` is a real three.js character editor over these bindings with generated phenotype/body/face/pose controls, materials/textures, clip preview, presets/state, and GLB export.''')
          replace(
              "README.md",
              '''That proves the portable browser runtime; it is **not** the still-deferred complete browser character-editor UI or WebGPU backend.''',
              '''The same WASM artifact also exposes the `anny-gpu` blendshape kernel through browser WebGPU. The browser editor and WebGPU path are both exercised in real Chrome; see `examples/editor/README.md`, `docs/GPU.md`, and `docs/VALIDATION.md`.''')
          old_later = '''## What is intentionally still later work\n\nNative v1 establishes portable correctness and authoring. The next project phase is intentionally separate:\n\n1. **GPU/WebGPU backend**.\n2. **SIMD tuning**.\n3. **Unity Runtime/Editor package**.\n4. **Complete browser character editor**.\n5. **Serious performance optimization** (profiling, reusable workspaces, allocation/layout tuning, incremental updates, batching/threading and load-time work).\n\nSee [Porting status](docs/PORTING_STATUS.md) for precise supported/deferred boundaries.'''
          new_later = '''## Post-v1 product and performance status\n\nThe successor work that began after native-v1 is now delivered at the measured scope recorded in the repository:\n\n1. **GPU/WebGPU foundation** — `anny-gpu` ships a real wgpu/Vulkan + browser WebGPU blendshape kernel with resident weights and strict CPU-parity qualification. Profiling showed that automatically routing normal single-character evaluation through this kernel would be slower; broader FK/skinning/fitting offload remains optional future GPU expansion rather than a fake speed claim.\n2. **SIMD investigation** — measured and closed: baseline x86-64 remains portable, while opt-in `x86-64-v3`/native builds gain roughly 5-15%; hand-written SIMD was not justified by the measured ceiling.\n3. **Unity Runtime/Editor package** — delivered under `integrations/unity/`, including editor and player validation.\n4. **Browser character editor** — delivered under `examples/editor/` and driven in real Chrome.\n5. **Profiling-driven performance work** — fixed the dominant redundant validation/allocation costs, accelerated prepare/reload/collision, added pose sessions, and documented rejected/optional optimizations.\n\nSee [Porting status](docs/PORTING_STATUS.md), [performance](docs/PERFORMANCE.md), [GPU](docs/GPU.md), and [validation](docs/VALIDATION.md) for measured boundaries.''' 
          replace("README.md", old_later, new_later)

          replace(
              "docs/UNITY_WEBGL.md",
              '''> Status: `integrations/unity/package/Plugins/WebGL/` still contains `libanny.a` and\n> `anny-eh-shim.jslib` from this attempt. They are **not** a supported configuration: a WebGL player\n> build with them fails at link (step 7 below). Deleting them was blocked by the consent layer and is\n> pending owner approval; they are inert on every other platform, and `integrations/unity/.gitignore`\n> keeps them out of the repository until the link works.''',
              '''> Status: the unsupported generated WebGL plugin artifacts were deleted with owner approval and are\n> git-ignored. `tools/build-native-webgl.sh` can reproduce the experiment, but the Unity WebGL player\n> remains unsupported until the Rust/Emscripten unwind mismatch described below is resolved.''')

          replace(
              "docs/ACTIVE_WORK.md",
              '''## Next project phase — intentionally unfinished\n\nThe following remain the major successor workstream:''',
              '''## Post-v1 product/performance phase — delivered at measured scope\n\nThe original successor workstream has now been carried through as follows:''')
          replace(
              "docs/ACTIVE_WORK.md",
              '''   measured through and corrected: 2 closed (per-character accumulation at the hardware limit;\n   zero-copy loading decided-and-declined), 1 answered and its stale number fixed (`derive measure` is\n   1.238 ms min / 1.590 ms median, not 8.5 ms), 1 blocked on a deliberate parity decision (collision's\n   exact-AABB candidate set changes the answer, so it is not a pure optimization). One thing still needs\n   the owner rather than more work: that collision parity call.''',
              '''   measured through and corrected: per-character accumulation is at the measured hardware floor;\n   zero-copy loading was deliberately declined; `derive measure` is 1.238 ms min / 1.590 ms median;\n   and collision keeps the existing parity-compatible candidate semantics. The faster exact-AABB\n   alternative was rejected because it changes the answer, so it is not a pure optimization.''')

          replace(
              "docs/PORTING_STATUS.md",
              '''5. **Serious performance optimization** — profiled and re-measured: the fixed per-call cost was redundant tensor validation, the cold prepare path is ~9.5x faster, collision went 64.6 -> 11.4 ms and `derive measure` 8.5 -> 1.24 ms. What remains is decision-gated rather than unmeasured (mmap/zero-copy reload, the collision parity call, a dtype choice); see `docs/PERFORMANCE.md`.''',
              '''5. **Serious performance optimization** — profiled and re-measured: the fixed per-call cost was redundant tensor validation, the cold prepare path is ~9.5x faster, collision went 64.6 -> 11.4 ms and `derive measure` 8.5 -> 1.24 ms. Zero-copy reload was measured and deliberately declined, collision preserves parity rather than adopting a faster answer-changing candidate set, and wider CPU targets remain an opt-in deployment choice; see `docs/PERFORMANCE.md`.''')

          replace(
              "docs/VALIDATION.md",
              '''Not verified here: browser *performance*, real licensed SMPL or SMPL-X assets, GPU\nimplementations, exhaustive collision equivalence, or complete iterative optimizer\nequivalence.''',
              '''Not verified here: browser *performance*, real licensed SMPL or SMPL-X assets, exhaustive\ncollision equivalence, or complete iterative optimizer equivalence. GPU/WebGPU implementation\nqualification is recorded later in this same document and in `docs/GPU.md`.''')

          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check -p anny-wasm --target wasm32-unknown-unknown --locked
          cargo build --workspace --release --locked
      - name: Commit reviewed corrections and remove temporary runner
        shell: bash
        run: |
          git rm .github/workflows/reviewer-repair.yml
          git add -A
          git config user.name "OpenAI review repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix final-review ownership, Unity sessions and public boundaries"
          git push origin HEAD:codex/native-v1-completion
