# Temporary source delivery; removed before the PR handoff.
name: Native completeness delivery
on:
  push:
    branches: [codex/native-v1-completion]
    paths: [.github/v1-delivery/ready.json]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Apply exact checksummed native source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/native-v1-completion
          cat .github/v1-delivery/000.b64 .github/v1-delivery/001.b64 .github/v1-delivery/002.b64 .github/v1-delivery/003.b64 .github/v1-delivery/004.b64 .github/v1-delivery/005.b64 .github/v1-delivery/006.b64 .github/v1-delivery/007.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/native.patch"
          expected=$(jq -r .sha256 .github/v1-delivery/ready.json)
          test "$(sha256sum "$RUNNER_TEMP/native.patch" | cut -d' ' -f1)" = "$expected"
          git apply --check "$RUNNER_TEMP/native.patch"
          git apply "$RUNNER_TEMP/native.patch"
      - name: Validate native f32 runtime and interfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check -p anny-wasm --target wasm32-unknown-unknown --locked
          cargo build --workspace --release --locked
          mkdir -p output
          cc -std=c11 -Wall -Wextra -Werror -Iinclude examples/c_f32_smoke.c -Ltarget/release -lanny_capi -lm -Wl,-rpath,"$PWD/target/release" -o output/c-f32-smoke
          ./output/c-f32-smoke data
          ./target/release/anny generate --assets data --config examples/all.json --params examples/character.json --precision f32 --output output/character-f32.safetensors --mesh output/character-f32.glb --rigged true
      - name: Publish tested source on the requested branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- Cargo.toml Cargo.lock README.md crates docs examples include
          if git diff --cached --name-only | grep -E '^(data/|tools/|\.github/)'; then exit 1; fi
          test "$(git ls-remote origin refs/heads/codex/native-v1-completion | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Anny Rust port'
          git config user.email '131926685+magiccodingman@users.noreply.github.com'
          git commit -m "Add shared-equation native f32 runtime, typed language APIs and precision tests"
          git push origin HEAD:refs/heads/codex/native-v1-completion
          git rev-parse HEAD
