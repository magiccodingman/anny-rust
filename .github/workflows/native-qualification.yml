name: Native runtime qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/native-v1-completion]
    paths:
      - .github/workflows/native-qualification.yml
      - examples/qualification/**
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native and browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --release --locked
          cargo build -p anny-wasm --release --locked --target wasm32-unknown-unknown
          mkdir -p output/bindgen
          cd output/bindgen
          asset=wasm-bindgen-0.2.100-x86_64-unknown-linux-musl.tar.gz
          url=https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.100
          curl --fail --location --retry 3 "$url/$asset" -o "$asset"
          curl --fail --location --retry 3 "$url/$asset.sha256sum" -o "$asset.sha256sum"
          sha256sum --check "$asset.sha256sum"
          tar -xzf "$asset"
          cd ../..
          ./output/bindgen/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl/wasm-bindgen --target web --out-dir examples/browser/pkg target/wasm32-unknown-unknown/release/anny_wasm.wasm
          ./target/release/anny prepare --assets data --output output/ci-model.safetensors
      - name: Exercise actual C and C# lifecycles
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Iinclude examples/c_float_smoke.c -Ltarget/release -lanny_capi -lm -Wl,-rpath,"$PWD/target/release" -o output/c-float-smoke
          ./output/c-float-smoke data
          export LD_LIBRARY_PATH="$PWD/target/release:${LD_LIBRARY_PATH:-}"
          dotnet run --project examples/csharp --configuration Release -- "$PWD/output/ci-model.safetensors"
      - name: Run Chromium WebAssembly lifecycle
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix examples/qualification --ignore-scripts --no-audit --no-fund
          cd examples/qualification
          npx playwright install --with-deps chromium
          cd ../..
          node examples/qualification/browser.cjs
      - name: Record checkpoint
        if: always()
        run: git rev-parse HEAD > output/qualification-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runtime-qualification
          path: |
            output/browser-result.json
            output/qualification-commit.txt
            output/bindgen/*.tar.gz
            output/bindgen/*.sha256sum
            examples/browser/pkg
          retention-days: 7
