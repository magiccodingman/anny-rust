name: Publish AMASS refinement parity fix
on:
  push:
    branches: [codex/native-v1-completion]
    paths: [.github/workflows/v1-amass-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Apply exact source edit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/anny-core/src/motion.rs')
          s = p.read_text()
          old_doc = "/// finite-difference/registration baseline, without optional post_gd refinement.\npub fn fit_amass(\n"
          new_doc = "/// finite-difference/registration baseline with optional native post_gd refinement\n/// inherited from `options.shape`; external source assets remain caller-supplied.\npub fn fit_amass(\n"
          if old_doc not in s:
              raise SystemExit('AMASS doc anchor did not match exactly')
          s = s.replace(old_doc, new_doc, 1)
          old = (
              "    let mut initialization = FitOptions {\n"
              "        initial_phenotype_kwargs: shape.parameters.phenotype_kwargs.clone(),\n"
              "        initial_pose_parameters: target\n"
              "            .pose_parameters(&shape.output, PoseParameterization::LocalBone)?\n"
              "            .nested_json(),\n"
              "        optimize_phenotypes: false,\n"
              "        max_n_iters: Some(options.pose_iterations),\n"
              "        ..Default::default()\n"
              "    };\n"
          )
          new = (
              "    // Reuse the caller's fitting/refinement settings for the pose stage while\n"
              "    // freezing the shape estimated on the rest frame. This keeps native AMASS\n"
              "    // conversion aligned with the upstream workflow's optional post-GD controls\n"
              "    // instead of silently dropping them after shape fitting. A shape prior is\n"
              "    // disabled for pose-only refinement because phenotypes are frozen here.\n"
              "    let mut initialization = options.shape.clone();\n"
              "    initialization.initial_phenotype_kwargs = shape.parameters.phenotype_kwargs.clone();\n"
              "    initialization.initial_pose_parameters = target\n"
              "        .pose_parameters(&shape.output, PoseParameterization::LocalBone)?\n"
              "        .nested_json();\n"
              "    initialization.optimize_phenotypes = false;\n"
              "    initialization.max_n_iters = Some(options.pose_iterations);\n"
              "    initialization.shared_phenotypes = false;\n"
              "    initialization.multistart.clear();\n"
              "    initialization.post_gd_prior_weight = 0.;\n"
          )
          if old not in s:
              raise SystemExit('AMASS initialization anchor did not match exactly')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p anny-core --locked motion -- --nocapture
          cargo clippy -p anny-core --all-targets --locked -- -D warnings
      - name: Commit source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/native-v1-completion | cut -f1)" = "$GITHUB_SHA"
          git add crates/anny-core/src/motion.rs
          test "$(git diff --cached --name-only)" = "crates/anny-core/src/motion.rs"
          git config user.name 'Anny Rust port'
          git config user.email '131926685+magiccodingman@users.noreply.github.com'
          git commit -m "Carry native post-GD options through AMASS pose fitting"
          git push origin HEAD:refs/heads/codex/native-v1-completion
