# Temporary development workflow; removed before the implementation is ready.
name: Port bootstrap
on:
  push:
    paths: [.github/workflows/port-bootstrap.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare reference-only dependency
        run: python -m pip download --no-deps warp-lang==1.9.1 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: port-warp-reference
          path: wheels/
          retention-days: 1
          compression-level: 0
