# Temporary development workflow; removed before the implementation is ready.
name: Port bootstrap
on:
  push:
    paths: [.github/workflows/port-bootstrap.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/checkout@v4
        with:
          repository: naver/anny
          ref: 81ca83e202273b306205c1cc15f33734be31e48c
          path: upstream
      - name: Prepare toolchain and offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/crate/src offline/downloads
          cp -r upstream offline/upstream
          rm -rf offline/upstream/.git
          python -m pip download roma --no-deps -d offline/downloads
          printf 'fn main() {}\n' > offline/crate/src/main.rs
          cat > offline/crate/Cargo.toml <<'EOF'
          [package]
          name = "anny-offline-deps"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          nalgebra = { version = "=0.33.2", features = ["serde-serialize"] }
          serde = { version = "=1.0.219", features = ["derive"] }
          serde_json = { version = "=1.0.140", features = ["preserve_order"] }
          thiserror = "=2.0.12"
          safetensors = "=0.4.5"
          flate2 = "=1.1.0"
          png = "=0.17.16"
          sha2 = "=0.10.8"
          wasm-bindgen = "=0.2.100"
          js-sys = "=0.3.77"
          EOF
          cd offline/crate
          mkdir .cargo
          cargo vendor --locked ../vendor > .cargo/config.toml || cargo vendor ../vendor > .cargo/config.toml
          cd ../..
          mkdir offline/toolchain
          cp -a "$(rustc --print sysroot)/bin" offline/toolchain/
          cp -a "$(rustc --print sysroot)/lib" offline/toolchain/
          rm -rf offline/toolchain/lib/rustlib/src
          tar -cJf port-offline-inputs.tar.xz -C offline .
      - uses: actions/upload-artifact@v4
        with:
          name: port-offline-inputs
          path: port-offline-inputs.tar.xz
          retention-days: 1
          compression-level: 0
